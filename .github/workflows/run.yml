name: Run code

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Базовая валюта (USD, EUR, KZT)"
        default: "USD"
  schedule:
    - cron: "0 4 * * *"   # каждый день в 04:00 UTC = 09:00 в Алматы

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run script
        env:
          NAME: ${{ inputs.name }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py
