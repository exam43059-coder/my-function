name: Run code

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Имя"
        default: "Айдос"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run script
        env:
          NAME: ${{ inputs.name }}
        run: python main.py
